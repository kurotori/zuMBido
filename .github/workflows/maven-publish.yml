# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path
name: Build Windows Executable
on: [push]

jobs:
  build:

    runs-on: windows-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build JAR
      run: mvn clean package

    - name: Create EXE with jpackage
      run: |
          jpackage --name "ZuMBido" --input Java/ZuMBido/target/ --main-jar ZuMBido-0.1-ALPHA-jar-with-dependencies.jar --main-class com.ejemplo.zumbido.interfaz.InicioBase --type exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
          name: ZuMBido-Windows
          path: ZuMBido-*.exe
