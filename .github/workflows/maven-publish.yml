name: Build Windows Executable
on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build JAR
        run: mvn clean package
      - name: Create EXE with jpackage
        run: |
          jpackage --name "ZuMBido" --input target/ --main-jar ZuMBido-0.1-ALPHA-jar-with-dependencies.jar --main-class com.ejemplo.zumbido.interfaz.InicioBase --type exe
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuMBido-Windows
          path: ZuMBido-*.exe
